<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>founderive logo — ḟ</title>
<style>
  :root { --navy:#0e1a2b; --lime:#d7ee63; --pale:#f6ffbf; --paper:#f7f6f1; --line:#e4e3db; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--paper); color:#1c2430; padding: 40px 24px 60px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color:#5c6570; margin: 0 0 32px; font-size: .95rem; line-height:1.5; }
  .sub b { color:#1c2430; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:18px; }
  .card { border:1px solid var(--line); border-radius:16px; padding:26px; background:#fff; display:flex; flex-direction:column; align-items:center; gap:16px; }
  .card.dark { background: var(--navy); border-color:#1d2c40; color:#fff; }
  .label { font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; color:#8a929c; }
  .card.dark .label { color:#7d8ba0; }
  .row { display:flex; align-items:center; gap:14px; }
  .wordmark { display:flex; align-items:center; gap:11px; font-weight:800; font-size:1.5rem; letter-spacing:-.01em; }
  .fav { display:flex; align-items:center; gap:18px; }
  .fav .os { display:flex; align-items:center; gap:8px; background:#eceadf; border-radius:8px; padding:6px 12px 6px 6px; font-size:.85rem; color:#4b535d; }
</style>
</head>
<body>
<div class="wrap">
  <h1>founderive &mdash; the ḟ mark</h1>
  <p class="sub"><b>ḟ</b> is <b>f&#775;</b>: a lowercase f with Newton&rsquo;s derivative dot &mdash; the first derivative of f. <b>founder</b> + <b>derive</b>, collapsed into one glyph: the founder, differentiated.</p>

  <div class="grid">

    <div class="card dark">
      <div class="label">App icon</div>
      <svg width="112" height="112" viewBox="0 0 64 64" fill="none">
        <rect width="64" height="64" rx="15" fill="#0e1a2b" stroke="#22344c" stroke-width="1"/>
        <circle cx="31" cy="9.5" r="4.4" fill="#f6ffbf"/>
        <path d="M30 52 V26 C30 20 33.6 17.5 39 17.5" stroke="#d7ee63" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M21 30 H38" stroke="#d7ee63" stroke-width="6.4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="card">
      <div class="label">Glyph on light</div>
      <svg width="96" height="96" viewBox="0 0 64 64" fill="none">
        <circle cx="31" cy="9.5" r="4.4" fill="#9cb936"/>
        <path d="M30 52 V26 C30 20 33.6 17.5 39 17.5" stroke="#0e1a2b" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M21 30 H38" stroke="#0e1a2b" stroke-width="6.4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="card dark">
      <div class="label">Wordmark (dark)</div>
      <div class="wordmark">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
          <circle cx="15.5" cy="4.75" r="2.2" fill="#f6ffbf"/>
          <path d="M15 26 V13 C15 10 16.8 8.75 19.5 8.75" stroke="#d7ee63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10.5 15 H19" stroke="#d7ee63" stroke-width="3.2" stroke-linecap="round"/>
        </svg>
        <span style="color:#fff">founderive</span>
      </div>
    </div>

    <div class="card">
      <div class="label">Wordmark (light)</div>
      <div class="wordmark">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
          <circle cx="15.5" cy="4.75" r="2.2" fill="#9cb936"/>
          <path d="M15 26 V13 C15 10 16.8 8.75 19.5 8.75" stroke="#0e1a2b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10.5 15 H19" stroke="#0e1a2b" stroke-width="3.2" stroke-linecap="round"/>
        </svg>
        <span style="color:#0e1a2b">founderive</span>
      </div>
    </div>

    <div class="card">
      <div class="label">Favicon sizes</div>
      <div class="fav">
        <div class="os">
          <svg width="16" height="16" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="15" fill="#0e1a2b"/><circle cx="31" cy="9.5" r="4.4" fill="#f6ffbf"/><path d="M30 52 V26 C30 20 33.6 17.5 39 17.5" stroke="#d7ee63" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 30 H38" stroke="#d7ee63" stroke-width="6.4" stroke-linecap="round"/></svg>
          16&nbsp;px
        </div>
        <svg width="32" height="32" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="15" fill="#0e1a2b"/><circle cx="31" cy="9.5" r="4.4" fill="#f6ffbf"/><path d="M30 52 V26 C30 20 33.6 17.5 39 17.5" stroke="#d7ee63" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 30 H38" stroke="#d7ee63" stroke-width="6.4" stroke-linecap="round"/></svg>
        <svg width="48" height="48" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="15" fill="#0e1a2b"/><circle cx="31" cy="9.5" r="4.4" fill="#f6ffbf"/><path d="M30 52 V26 C30 20 33.6 17.5 39 17.5" stroke="#d7ee63" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 30 H38" stroke="#d7ee63" stroke-width="6.4" stroke-linecap="round"/></svg>
      </div>
    </div>

    <div class="card dark">
      <div class="label">Reverse (lime tile)</div>
      <svg width="112" height="112" viewBox="0 0 64 64" fill="none">
        <rect width="64" height="64" rx="15" fill="#d7ee63"/>
        <circle cx="31" cy="9.5" r="4.4" fill="#0e1a2b"/>
        <path d="M30 52 V26 C30 20 33.6 17.5 39 17.5" stroke="#0e1a2b" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M21 30 H38" stroke="#0e1a2b" stroke-width="6.4" stroke-linecap="round"/>
      </svg>
    </div>

  </div>
</div>
</body>
</html>
