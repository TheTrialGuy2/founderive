<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>founderive wordmark</title>
<style>
  :root { --navy:#0e1a2b; --lime:#d7ee63; --pale:#f6ffbf; --paper:#f7f6f1; --line:#e4e3db; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--paper); color:#1c2430; padding:40px 24px 60px; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#5c6570; margin:0 0 30px; font-size:.95rem; line-height:1.5; }
  .sub b { color:#1c2430; }
  .card { border:1px solid var(--line); border-radius:16px; padding:34px; background:#fff; margin-bottom:18px; }
  .card.dark { background:var(--navy); border-color:#1d2c40; }
  .label { font-size:.75rem; letter-spacing:.09em; text-transform:uppercase; color:#8a929c; margin-bottom:18px; }
  .card.dark .label { color:#7d8ba0; }
  .lockup { display:flex; align-items:center; gap:16px; }
  .row { display:flex; align-items:center; gap:40px; flex-wrap:wrap; }
  svg { display:block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>founderive &mdash; custom wordmark</h1>
  <p class="sub">Monoline, round-terminal, geometric lowercase &mdash; the same construction as the <b>ḟ</b> mark. The dotted <b>i</b> is drawn as a floating derivative dot, so the wordmark rhymes with the icon.</p>

  <div class="card">
    <div class="label">Wordmark on light</div>
    <svg width="340" height="74" viewBox="0 0 148 32" fill="none" style="color:#0e1a2b">
      <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <g transform="translate(4,0)"><path d="M6 26 V11 C6 7.8 7.6 6.5 10.5 6.5"/><path d="M1.8 14 H10.2"/></g>
        <g transform="translate(17,0)"><circle cx="7.5" cy="19" r="6.5"/></g>
        <g transform="translate(33,0)"><path d="M2 12 V20.5 C2 24 4.2 26 7 26 C9.8 26 12 24 12 20.5 V12"/></g>
        <g transform="translate(48,0)"><path d="M2 26 V16 C2 13.5 4 12 6.7 12 C9.4 12 11.4 13.5 11.4 16 V26"/></g>
        <g transform="translate(63,0)"><circle cx="7.5" cy="19" r="6.5"/><path d="M14 5 V26"/></g>
        <g transform="translate(80,0)"><path d="M2 19 H13 V16.3 C13 13.6 10.7 12 7.5 12 C4.2 12 2 14.4 2 19 C2 23.6 4.4 26 7.7 26 C10 26 11.7 25.1 12.7 23.2"/></g>
        <g transform="translate(96,0)"><path d="M2 26 V12"/><path d="M2 16 C2 13 4.3 12 7.4 12"/></g>
        <g transform="translate(107,0)"><path d="M2 26 V12"/></g>
        <g transform="translate(113,0)"><path d="M2 12 L7 26 L12 12"/></g>
        <g transform="translate(128,0)"><path d="M2 19 H13 V16.3 C13 13.6 10.7 12 7.5 12 C4.2 12 2 14.4 2 19 C2 23.6 4.4 26 7.7 26 C10 26 11.7 25.1 12.7 23.2"/></g>
      </g>
      <circle cx="109" cy="7.6" r="1.9" fill="#9cb936"/>
    </svg>
  </div>

  <div class="card dark">
    <div class="label">Wordmark on dark</div>
    <svg width="340" height="74" viewBox="0 0 148 32" fill="none" style="color:#f2f4ee">
      <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <g transform="translate(4,0)"><path d="M6 26 V11 C6 7.8 7.6 6.5 10.5 6.5"/><path d="M1.8 14 H10.2"/></g>
        <g transform="translate(17,0)"><circle cx="7.5" cy="19" r="6.5"/></g>
        <g transform="translate(33,0)"><path d="M2 12 V20.5 C2 24 4.2 26 7 26 C9.8 26 12 24 12 20.5 V12"/></g>
        <g transform="translate(48,0)"><path d="M2 26 V16 C2 13.5 4 12 6.7 12 C9.4 12 11.4 13.5 11.4 16 V26"/></g>
        <g transform="translate(63,0)"><circle cx="7.5" cy="19" r="6.5"/><path d="M14 5 V26"/></g>
        <g transform="translate(80,0)"><path d="M2 19 H13 V16.3 C13 13.6 10.7 12 7.5 12 C4.2 12 2 14.4 2 19 C2 23.6 4.4 26 7.7 26 C10 26 11.7 25.1 12.7 23.2"/></g>
        <g transform="translate(96,0)"><path d="M2 26 V12"/><path d="M2 16 C2 13 4.3 12 7.4 12"/></g>
        <g transform="translate(107,0)"><path d="M2 26 V12"/></g>
        <g transform="translate(113,0)"><path d="M2 12 L7 26 L12 12"/></g>
        <g transform="translate(128,0)"><path d="M2 19 H13 V16.3 C13 13.6 10.7 12 7.5 12 C4.2 12 2 14.4 2 19 C2 23.6 4.4 26 7.7 26 C10 26 11.7 25.1 12.7 23.2"/></g>
      </g>
      <circle cx="109" cy="7.6" r="1.9" fill="#d7ee63"/>
    </svg>
  </div>

  <div class="card dark">
    <div class="label">Full lockup (icon + wordmark)</div>
    <div class="lockup">
      <svg width="52" height="52" viewBox="0 0 64 64" fill="none">
        <rect width="64" height="64" rx="15" fill="#0e1a2b" stroke="#22344c" stroke-width="1"/>
        <circle cx="31" cy="9.5" r="4.4" fill="#f6ffbf"/>
        <path d="M30 52 V26 C30 20 33.6 17.5 39 17.5" stroke="#d7ee63" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M21 30 H38" stroke="#d7ee63" stroke-width="6.4" stroke-linecap="round"/>
      </svg>
      <svg width="266" height="57" viewBox="0 0 148 32" fill="none" style="color:#f2f4ee">
        <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <g transform="translate(4,0)"><path d="M6 26 V11 C6 7.8 7.6 6.5 10.5 6.5"/><path d="M1.8 14 H10.2"/></g>
          <g transform="translate(17,0)"><circle cx="7.5" cy="19" r="6.5"/></g>
          <g transform="translate(33,0)"><path d="M2 12 V20.5 C2 24 4.2 26 7 26 C9.8 26 12 24 12 20.5 V12"/></g>
          <g transform="translate(48,0)"><path d="M2 26 V16 C2 13.5 4 12 6.7 12 C9.4 12 11.4 13.5 11.4 16 V26"/></g>
          <g transform="translate(63,0)"><circle cx="7.5" cy="19" r="6.5"/><path d="M14 5 V26"/></g>
          <g transform="translate(80,0)"><path d="M2 19 H13 V16.3 C13 13.6 10.7 12 7.5 12 C4.2 12 2 14.4 2 19 C2 23.6 4.4 26 7.7 26 C10 26 11.7 25.1 12.7 23.2"/></g>
          <g transform="translate(96,0)"><path d="M2 26 V12"/><path d="M2 16 C2 13 4.3 12 7.4 12"/></g>
          <g transform="translate(107,0)"><path d="M2 26 V12"/></g>
          <g transform="translate(113,0)"><path d="M2 12 L7 26 L12 12"/></g>
          <g transform="translate(128,0)"><path d="M2 19 H13 V16.3 C13 13.6 10.7 12 7.5 12 C4.2 12 2 14.4 2 19 C2 23.6 4.4 26 7.7 26 C10 26 11.7 25.1 12.7 23.2"/></g>
        </g>
        <circle cx="109" cy="7.6" r="1.9" fill="#d7ee63"/>
      </svg>
    </div>
  </div>

</div>
</body>
</html>
